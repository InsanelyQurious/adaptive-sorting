# Task / Gymnasium environment definition
env_id: VolvoSorting-v0
task:
  name: adaptive_vision_guided_component_sorting
  objects: [bracket, bolt]
  # Fixed sorting mapping (also stated in README): bracket -> Bin A, bolt -> Bin B
  bin_mapping: {bracket: bin_a, bolt: bin_b}
  bins: [bin_a, bin_b]
  mode: sequential          # 'single' = one random target per episode; 'sequential' = sort both, one at a time
  max_episode_steps: 200    # at 10 Hz -> 20 s
  settle_steps: 40          # physics steps after spawning before the episode starts
  table_height: 0.80
  drop_z_threshold: 0.70    # object below this height = fell off the table -> failure
  lift_height: 0.06         # object this far above its rest height counts as lifted
  grasp_hold_steps: 2       # consecutive control steps with both pads in contact to count as grasped
  # Initial-state curriculum (TRAINING RESETS ONLY; evaluation/inference always start from home):
  # a fraction of training episodes begin with the gripper scripted to a pre-grasp pose above the
  # target (open), or already holding it, so the lift/transport/place stages receive learning signal
  # while the approach is still being learned. Set both to 0 to disable.
  curriculum:
    pregrasp_prob: 0.15             # hover above the part, gripper open
    straddle_prob: 0.20             # fingers around the part at grasp height, gripper open (reverse curriculum)
    grasped_prob: 0.25              # already holding the part (lifted) -> transport must be learned from here
    overbin_prob: 0.10              # holding the part above its correct bin (only the release is left)
    pregrasp_height: [0.03, 0.12]   # hover height above the part for pre-grasp starts [m]
observation:
  image_key: observation.images.overhead
  state_key: observation.state
  image_size: [64, 64]
  include_image: true
  state_noise_std: 0.0      # base noise, scaled further by randomization
  joint_vel_scale: 0.2
action:
  # a[0:3] = dX dY dZ, a[3:6] = dRx dRy dRz, a[6] = gripper (-1 open .. +1 closed); all in [-1, 1]
  dim: 7
  gripper_index: 6
  gripper_mode: binary       # 'binary': a[6] > 0 -> fully close, else fully open (decisive grasps); 'continuous': aperture ~ a[6]
# Reward weights (all components are computed every step; see training/rewards/sorting_reward.py).
# Shaping terms are potential-based: reward = weight * (phi_t - phi_{t-1}). Potentials are pure functions
# of simulator state and are charged back on regress (a dropped part loses its lift/transport progress),
# and each one is active during exactly one phase per target (approach: until first grasp; lift and
# transport: first grasp -> placement), so no gate can be cycled to farm reward (see DEBUGGING.md).
reward:
  approach_reward: 10.0       # phi = 1 - tanh(k * dist(tcp, pre-grasp target)); full approach ~ +10 total
  approach_scale: 8.0
  approach_hover_height: 0.12 # pre-grasp target sits this far above the part while xy-misaligned
  approach_hover_radius: 0.04 # ... and descends onto the part once xy error < this
  approach_align_fraction: 0.2 # phi_approach *= 1 - f*(1-|cos(gripper x-axis, part long axis)|): yaw alignment pays inside the potential
  align_reward: 0.0           # (legacy per-step alignment term, removed: it paid for hovering next to a released part)
  push_penalty: -0.2          # * min(1, object xy speed / push_speed_scale) while not grasped
  push_speed_scale: 0.2
  grasp_reward: 0.05          # tiny per-step maintain term while both pads hold the target (bounded ≪ placement)
  grasp_bonus_once: 10.0      # one-time bonus when the grasp is first established
  lift_reward: 5.0            # one-time bonus for lifting the grasped object above lift_height
  lift_shaping: 5.0           # potential: object height above rest / lift_cap (first grasp -> placement; drop = charged back)
  lift_cap: 0.15
  transport_reward: 10.0      # potential: 1 - tanh(k * xy dist(object, correct bin)) (first grasp -> placement)
  transport_scale: 4.0
  placement_reward: 40.0      # one-time: object released inside correct bin
  task_complete_bonus: 40.0   # all objects sorted
  release_penalty: -2.0       # gripper opened (grasp lost) anywhere but over the correct bin
  collision_penalty: -1.0     # per step with arm/gripper-body collision against table or bins
  wrong_bin_penalty: -20.0    # object released into the wrong bin (episode ends)
  drop_penalty: -10.0         # object falls off table or sim unstable (episode ends)
  control_effort_penalty: -0.01  # * sum(action^2)
  time_penalty: -0.02         # per step
  timeout_penalty: -5.0       # on truncation without success
randomization:
  # level scales all ranges: 0 = fixed layout (debug), 1 = full ranges below
  level: 1.0
  spawn_zone:                 # objects spawn uniformly in this table region (world frame)
    x: [0.02, 0.34]
    y: [-0.20, 0.20]
    min_separation: 0.16
  object_yaw: [-3.1416, 3.1416]      # full rotation
  randomize_bins: true               # bins move ONLY at episode start (reset), by up to bin_position_jitter * level;
  bin_position_jitter: [0.04, 0.04]  # +/- x, y [m]. Scenario presets keep bins fixed; set randomize_bins: false to never move them.
  object_scale: [0.92, 1.08]         # uniform scale factor on object geoms (mass scales with volume)
  friction: [0.7, 1.2]               # sliding friction on objects
  state_noise_std: 0.005             # gaussian noise on observation.state (at level 1)
  image_noise_std: 2.0               # pixel noise (0-255 scale)
  light_jitter: true                 # jitter key-light direction and ambient
  # Training-time clutter exposure (OFF by default). With prob > 0 a training reset also drops 1..max_parts random
  # extra/rejection parts from the catalog pool on the table (clear of the task objects and bins). The current
  # checkpoints were trained with 0 -> they are not clutter-aware (DEBUGGING.md part 3). Evaluation never adds clutter.
  clutter:
    prob: 0.0
    max_parts: 2
    parts: [bracket_extra, bolt_extra, reject_cap]
